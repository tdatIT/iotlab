# Builds the iotlab-service Docker image and pushes it to Docker Hub.
#
# Repo settings -> Secrets and variables -> Actions:
#   secret DOCKERHUB_USERNAME  Docker Hub user
#   secret DOCKERHUB_TOKEN     Docker Hub access token (Account settings -> Personal access tokens, Read & Write)
#
# Tags: latest (main), sha-<short>, and vX.Y.Z / X.Y for git tags vX.Y.Z.
name: iotlab-service image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "iotlab-service/**"
      - ".github/workflows/iotlab-service-image.yml"
  workflow_dispatch:

concurrency:
  group: iotlab-service-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/iotlab-service
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: ./iotlab-service
          # The Dockerfile builds GOARCH=amd64 only.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
