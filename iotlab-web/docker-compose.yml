services:
  web:
    build:
      context: .
      args:
        # API base the browser calls directly (must be reachable from the browser).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
    image: iotlab-web:latest
    ports:
      - "8080:80"
    restart: unless-stopped
